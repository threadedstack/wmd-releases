# Builds Edge.js's node core (edgejs.wasm) for wmd. Installed as .github/workflows/edge-modules.yml of
# threadedstack/wmd-releases (source: release/edge-modules.yml of threadedstack/wmd).
#
# The node core is the one part of a release that a release run does not build: the build is long and its result is
# pinned by sha256 in wmd's Makefile (EDGEJS_SHA256 for node 24, EDGEJS_SHA256_22 and EDGEJS_SHA256_20). This workflow is
# where a pinned module comes from. No developer's machine builds one that ships.
#
# `gh workflow run edge-modules.yml -R threadedstack/wmd-releases -f sha=<full sha> [-f major=22]` builds the module of
# that wmd commit twice, on two runners and in two different folders (scripts/rebuild-edgejs.sh with the pinned wasixcc,
# LLVM, sysroot and wasm-opt), and fails when the two files differ, when one names a folder of its runner, or when one
# holds the text "/Users/". The run's summary gives the sha256 to pin. With `-f publish=true` the file must also be the
# one the commit's Makefile pins; it is then put into the edge-modules release as edgejs-<sha256>.wasm (for node 24 with
# the commit's edge/edgejs.NOTICES.txt, which must name the same sha256), where the release run takes it
# (scripts/release-part.sh edgejs).
#
# So a new pin takes two runs: one without publish at the commit that changes the build, which prints the sha256; then,
# with that sha256 pinned (and the notices written again), one with publish at the pinning commit.
#
# Third-party actions are pinned by commit (the tag in the comment); checkout follows release.yml.
# Secrets: RELEASE_APP_CLIENT_ID and RELEASE_APP_KEY (the release GitHub App, to read threadedstack/wmd).
name: edge-modules
run-name: edge-modules node ${{ inputs.major }} ${{ inputs.sha }} (${{ inputs.publish && 'publish' || 'dry run' }})

on:
  workflow_dispatch:
    inputs:
      sha:
        description: full commit sha of threadedstack/wmd
        required: true
        type: string
      major:
        description: node major of the module (24 is the default module)
        type: choice
        options: ['24', '22', '20']
        default: '24'
      publish:
        description: put the module into the edge-modules release (it must be the one the commit's Makefile pins)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: edge-modules-${{ inputs.major }}-${{ inputs.publish && 'publish' || github.run_id }}
  cancel-in-progress: false

env:
  SHA: ${{ inputs.sha }}
  MAJOR: ${{ inputs.major }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the same build twice, each in a folder named after its letter
        copy: [a, b]
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: threadedstack
          repositories: wmd
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: threadedstack/wmd
          ref: ${{ inputs.sha }}
          token: ${{ steps.token.outputs.token }}
          path: wmd
          persist-credentials: false
      - name: the pinned toolchain (wasixcc 0.4.7, LLVM 21.1.206, sysroot v2026-07-03.1, wasm-opt 133)
        uses: wasix-org/wasixcc@d59389f68277c60b65cb1cc1524de641d845d336 # v0.4.7
        with:
          version: v0.4.7
          github_token: ${{ github.token }}
          sysroot-tag: v2026-07-03.1
          llvm-tag: 21.1.206
          binaryen-tag: version_133
      - name: the Makefile's pins for node ${{ inputs.major }}
        id: pins
        run: |
          if [ "$MAJOR" = 24 ]; then pinvar=EDGEJS_SHA256; else pinvar=EDGEJS_SHA256_$MAJOR; fi
          lib=$(awk -v k="EDGEJS_NODE_LIB_$MAJOR" '$1 == k && $2 == ":=" { print $3; exit }' wmd/Makefile)
          pin=$(awk -v k="$pinvar" '$1 == k && $2 == ":=" { print $3; exit }' wmd/Makefile)
          [[ $lib =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "the Makefile has no EDGEJS_NODE_LIB_$MAJOR"; exit 1; }
          [[ $pin =~ ^[0-9a-f]{64}$ ]] || { echo "the Makefile has no $pinvar"; exit 1; }
          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "node library $lib, $pinvar $pin"
      - name: build edgejs.wasm (scripts/rebuild-edgejs.sh)
        env:
          EDGEJS_NODE_LIB: ${{ steps.pins.outputs.lib }}
          EDGEJS_SRC: ${{ runner.temp }}/edgesrc-${{ matrix.copy }}/edgejs
        run: |
          wasixcc --version | head -3
          wasm-opt --version
          cmake --version | head -1
          mkdir -p "$RUNNER_TEMP/out"
          bash wmd/scripts/rebuild-edgejs.sh "$RUNNER_TEMP/out/edgejs.wasm"
      - name: the module names no folder of this runner
        run: |
          f="$RUNNER_TEMP/out/edgejs.wasm"
          bad=0
          for p in /Users/ "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /home/runner /private/var/; do
            n=$(LC_ALL=C grep -a -c -F -- "$p" "$f" || true)
            echo "$p: $n lines"
            [ "$n" = 0 ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "edgejs.wasm names a folder of the machine that built it"; exit 1; }
          sum=$(shasum -a 256 "$f" | cut -c1-64)
          echo "copy ${{ matrix.copy }}: sha256 $sum, $(wc -c < "$f" | tr -d ' ') bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgejs-${{ matrix.copy }}
          path: ${{ runner.temp }}/out/edgejs.wasm
          if-no-files-found: error
          retention-days: 3

  check:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: threadedstack
          repositories: wmd
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: threadedstack/wmd
          ref: ${{ inputs.sha }}
          token: ${{ steps.token.outputs.token }}
          path: wmd
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in
      - name: the two builds are the same file
        id: same
        run: |
          a=$(sha256sum "$RUNNER_TEMP/in/edgejs-a/edgejs.wasm" | cut -c1-64)
          b=$(sha256sum "$RUNNER_TEMP/in/edgejs-b/edgejs.wasm" | cut -c1-64)
          echo "a $a"; echo "b $b"
          [ "$a" = "$b" ] || { echo "the two builds differ: the build is not reproducible" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [ "$MAJOR" = 24 ]; then pinvar=EDGEJS_SHA256; else pinvar=EDGEJS_SHA256_$MAJOR; fi
          pin=$(awk -v k="$pinvar" '$1 == k && $2 == ":=" { print $3; exit }' wmd/Makefile)
          echo "sum=$a" >> "$GITHUB_OUTPUT"
          if [ "$a" = "$pin" ]; then pinned=1; else pinned=0; fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          {
            echo "node $MAJOR at ${SHA:0:9}: both builds give sha256 $a"
            if [ "$pinned" = 1 ]; then echo "It is the commit's $pinvar."; else echo "The commit's $pinvar is $pin: pin $a."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: put the pinned module into the edge-modules release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SUM: ${{ steps.same.outputs.sum }}
          PINNED: ${{ steps.same.outputs.pinned }}
        run: |
          [ "$PINNED" = 1 ] || { echo "not published: the module is not the one the commit's Makefile pins"; exit 1; }
          up="$RUNNER_TEMP/up"; mkdir -p "$up"
          cp "$RUNNER_TEMP/in/edgejs-a/edgejs.wasm" "$up/edgejs-$SUM.wasm"
          files=("$up/edgejs-$SUM.wasm")
          if [ "$MAJOR" = 24 ]; then
            # the notices of the node 24 module name its sha256 on their second line (scripts/edgejs-notices.py)
            [ "$(sed -n 2p wmd/edge/edgejs.NOTICES.txt)" = "edgejs.wasm sha256: $SUM" ] ||
              { echo "edge/edgejs.NOTICES.txt of the commit names another module"; exit 1; }
            cp wmd/edge/edgejs.NOTICES.txt "$up/edgejs-$SUM.NOTICES.txt"
            files+=("$up/edgejs-$SUM.NOTICES.txt")
          fi
          gh release view edge-modules -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create edge-modules -R "$GITHUB_REPOSITORY" --prerelease --latest=false --title "edge-modules" \
              --notes "Edge.js node core builds that the web package holds (scripts/release-part.sh edgejs). Not a wmd release."
          gh release upload edge-modules "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
          echo "published edgejs-$SUM.wasm in the edge-modules release" | tee -a "$GITHUB_STEP_SUMMARY"
