# Publishes wmd's npm packages for every release of threadedstack/wmd-releases. Installed as
# .github/workflows/npm.yml of that repository by wmd's scripts/release.sh (source: npm/npm.yml of threadedstack/wmd).
#
# A published release starts it; `gh workflow run npm.yml -R threadedstack/wmd-releases -f tag=vX.Y.Z` runs it again
# for one tag. It downloads the release's files, checks them against SHA256SUMS.txt, packs
# the platform packages (@threadedstack/wmd-darwin-arm64, -linux-arm64, -linux-x64, -linux-arm64-musl, -linux-x64-musl),
# @threadedstack/wmd-node (node's files for the browser, which @threadedstack/wmd-web pins by sha256),
# @threadedstack/wmd-web and @threadedstack/wmd with npm/pack.mjs, installs them on a Mac with Apple silicon and runs
# `wmd --version` from them, and publishes each version not on npm yet, the platform packages first. (Linux is proved
# by scripts/linux-proof.sh before a release, not here.) npm trusts this workflow (trusted publishing): no npm token is stored anywhere.
name: npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (vX.Y.Z)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    # a published release whose tag is not a version (the edge-modules release of the node core) has no packages:
    # the run is skipped and opens no issue. A run by hand still fails on a tag that is not vX.Y.Z.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-15
    timeout-minutes: 180
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # a release packs with npm/pack.mjs of its own tag; a run by hand with that of the branch it runs on (older tags
      # have no npm/ folder)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@11.21.2 && npm --version
      - name: download the release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && shasum -a 256 -c SHA256SUMS.txt)
          commit=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body | sed -n 's/^commit: \([0-9a-f]\{40\}\)$/\1/p' | head -1)
          [ -n "$commit" ] || { echo "the release notes name no commit"; exit 1; }
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
      - name: pack
        run: |
          # npm lets this workflow publish a version of a package only once the package exists and names the workflow
          # as its trusted publisher: the owner's one step (release/SETUP.md, "npm"). Until @threadedstack/wmd-node
          # has had that step, the release is packed without it: the web package then carries no pins and node in the
          # browser stays in the guest. Only "no such package" (E404) is read as "not yet"; any other answer of npm
          # fails the run, so that a network fault does not publish a release without node's files.
          node_pkg=yes
          if ! out=$(npm view @threadedstack/wmd-node name 2>&1); then
            if grep -q 'E404' <<<"$out"; then
              node_pkg=no
              echo "::warning::@threadedstack/wmd-node is not on npm: this release is packed without node's files for the browser (release/SETUP.md, npm)"
            else
              echo "$out"; echo "npm did not say whether @threadedstack/wmd-node exists"; exit 1
            fi
          fi
          echo "NODE_PKG=$node_pkg" >> "$GITHUB_ENV"
          node npm/pack.mjs --assets "$RUNNER_TEMP/assets" --tag "$TAG" --commit "$COMMIT" --out "$RUNNER_TEMP/npm" --node-package "$node_pkg"
      - name: install and run them
        run: |
          export RUNTIME_DIR=$RUNNER_TEMP/npm
          d=$RUNNER_TEMP/try && mkdir -p "$d" && cd "$d" && npm init -y >/dev/null
          # the launcher's five platform packages are overrides to the local tarballs (the registry does not have them
          # yet), so npm picks by os, cpu and libc as it will for users: only the Mac's package is installed
          node -e "
            const fs = require('fs'), d = process.env.RUNTIME_DIR, o = {}
            const pk = JSON.parse(fs.readFileSync(d + '/packages.json', 'utf8'))
            for (const p of pk) o[p.name] = 'file:' + d + '/' + p.file
            const l = o['@threadedstack/wmd'], w = o['@threadedstack/wmd-web'], n = o['@threadedstack/wmd-node']
            delete o['@threadedstack/wmd']; delete o['@threadedstack/wmd-web']; delete o['@threadedstack/wmd-node']
            const deps = { '@threadedstack/wmd': l, '@threadedstack/wmd-web': w }
            // a browser fetches node's files by itself; here the package is installed only to compare it with the pins
            if (n) deps['@threadedstack/wmd-node'] = n
            fs.writeFileSync('package.json', JSON.stringify({ name: 'try', private: true, dependencies: deps, overrides: o }))"
          npm install --no-audit --no-fund
          want="wmd wmd-darwin-arm64 wmd-web "
          [ "$NODE_PKG" = yes ] && want="wmd wmd-darwin-arm64 wmd-node wmd-web "
          [ "$(ls node_modules/@threadedstack | LC_ALL=C sort | tr '\n' ' ')" = "$want" ] || { ls node_modules/@threadedstack; exit 1; }
          # the web package's pins and the node package are one pair: every pinned file is in the installed node
          # package with the pinned sha256, and the pins name this release's version. Without the node
          # package the web package carries no pins at all.
          NODE_PKG=$NODE_PKG VERSION=${TAG#v} node --input-type=module -e "
            const { existsSync, readFileSync } = await import('node:fs')
            const { createHash } = await import('node:crypto')
            const { pathToFileURL } = await import('node:url')
            const pins = process.cwd() + '/node_modules/@threadedstack/wmd-web/src/edge/pins.gen.js'
            if (process.env.NODE_PKG !== 'yes') {
              if (existsSync(pins)) throw new Error('the web package has pins but no node package was packed')
              console.log('no node package: the web package carries no pins')
            } else {
              const { EDGE_PACKAGE, EDGE_PINS } = await import(pathToFileURL(pins).href)
              if (EDGE_PACKAGE?.name !== '@threadedstack/wmd-node' || EDGE_PACKAGE.version !== process.env.VERSION) throw new Error('the pins name ' + JSON.stringify(EDGE_PACKAGE))
              if (!Array.isArray(EDGE_PINS) || EDGE_PINS.length === 0) throw new Error('the web package has no pins')
              for (const p of EDGE_PINS) {
                const b = readFileSync(process.cwd() + '/node_modules/@threadedstack/wmd-node/' + p.path)
                if (createHash('sha256').update(b).digest('hex') !== p.sha256) throw new Error('the node package does not hold the pinned ' + p.path)
              }
              console.log('the node package holds the ' + EDGE_PINS.length + ' pinned files of ' + EDGE_PACKAGE.name + '@' + EDGE_PACKAGE.version)
            }"
          out=$(npx wmd --version) && echo "$out"
          [[ "$out" == *"build ${COMMIT:0:8}"* ]] || { echo "wmd --version does not name ${COMMIT:0:8}"; exit 1; }
          node --input-type=module -e "
            const m = await import('@threadedstack/wmd')
            const { existsSync } = await import('node:fs')
            for (const p of m.PROGRAMS) if (!existsSync(m.binPath(p))) throw new Error(p)
            for (const g of ['vm.wasm', 'Image', 'Image-4k', 'initramfs.cpio.gz']) if (!existsSync(m.guestDir() + '/' + g)) throw new Error(g)
            if (m.hostGuestArch() !== 'arm64') throw new Error('guest arch ' + m.hostGuestArch())
            for (const f of ['@threadedstack/wmd-web', '@threadedstack/wmd-web/wmdpack.wasm', '@threadedstack/wmd-web/relay/relay.ts', '@threadedstack/wmd-web/guest/arm64/vm.wasm'])
              if (!existsSync(new URL(import.meta.resolve(f)))) throw new Error(f)
            console.log('all programs, guest files and web files are there')"
      - name: publish
        run: |
          cd "$RUNNER_TEMP/npm"
          launcher=@threadedstack/wmd
          specs=$(node -e "for (const p of require('./packages.json')) console.log(p.name + '@' + p.version + ':' + p.file)")
          # upload SPEC FILE, and upload it again every 30 seconds for up to 60 minutes while it fails: a network blip
          # (v0.1.23's first run: every upload failed to reach fulcio.sigstore.dev, which signs the provenance, and the
          # rerun minutes later passed) must not leave a release off npm. A failed upload that reached npm anyway is
          # not uploaded again.
          upload() {
            spec=$1; file=$2; start=$SECONDS
            until npm publish "./$file" --access public --provenance; do
              if npm view "$spec" version --prefer-online >/dev/null 2>&1; then echo "$spec reached npm"; return 0; fi
              if [ $((SECONDS - start)) -ge 3600 ]; then echo "$spec: every upload failed for 60 minutes"; return 1; fi
              echo "$spec: the upload failed; trying again in 30 seconds"
              sleep 30
            done
          }
          # publish SPEC:FILE... at once, then wait until npm shows each one: npm takes minutes to make a large package
          # public (a platform package: about 10), and the packages do not wait on one another
          publish() {
            pids=()
            for f in "$@"; do
              spec=${f%%:*}; file=${f#*:}
              if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already on npm"; continue; fi
              upload "$spec" "$file" & pids+=($!)
            done
            # every upload ends before a failed one stops the step, so the log shows each result
            failed=0; for p in "${pids[@]}"; do wait "$p" || failed=1; done
            [ $failed -eq 0 ] || exit 1
            left=("$@")
            for i in $(seq 1 120); do
              next=()
              for f in "${left[@]}"; do
                spec=${f%%:*}
                if npm view "$spec" version --prefer-online >/dev/null 2>&1; then echo "$spec is on npm"; else next+=("$f"); fi
              done
              left=("${next[@]}")
              [ ${#left[@]} -eq 0 ] && return 0
              sleep 30
            done
            for f in "${left[@]}"; do echo "${f%%:*} is still not on npm after 60 minutes"; done
            exit 1
          }
          # every package but the launcher first, all at once; the launcher only once its platform packages can be
          # installed, or an install in between would skip them
          others=(); main=()
          for f in $specs; do spec=${f%%:*}; if [ "${spec%@*}" = "$launcher" ]; then main+=("$f"); else others+=("$f"); fi; done
          [ ${#main[@]} -eq 1 ] || { echo "packages.json has ${#main[@]} $launcher packages, not 1"; exit 1; }
          publish "${others[@]}"
          publish "${main[@]}"

  tell-followers:
    # #85: once the packages are on npm, the wmd followers of wmn and wmr (wmd-follow.yml of threadedstack/wmn-releases and
    # threadedstack/wmr-releases) start at once instead of waiting for their cron. One entry per follower, each with a token for
    # its repository alone, so one that fails does not stop the other; a failed dispatch does no harm (the follower's cron finds
    # the version anyway).
    needs: [publish]
    if: success() && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo: [wmn-releases, wmr-releases]
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: threadedstack
          repositories: ${{ matrix.repo }}
          permission-contents: write
      - name: start the follower of wmd
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ matrix.repo }}
        run: |
          # only a version tag (vX.Y.Z) is sent; the event carries the version without the v
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG; nothing sent"; exit 0; }
          # the publish job saw each package with --prefer-online, but npm's cache can still answer 404 for a package for
          # a few seconds after that (wmr 0.0.51: @threadedstack/wmd-linux-x64), so the follower is started only once a
          # plain `npm view`, the way an install asks, finds wmd, wmd-web and every platform package of wmd; after 10
          # minutes it is started anyway (the follower waits for the packages too)
          v=${TAG#v}; gap=${NPM_SEEN_GAP:-15}
          left=("@threadedstack/wmd@$v" "@threadedstack/wmd-web@$v")
          plat=""
          for i in $(seq 1 40); do
            if [ -z "$plat" ]; then
              plat=$(npm view "@threadedstack/wmd@$v" optionalDependencies --json 2>/dev/null | grep -o '"@threadedstack/[^"]*"' | tr -d '"' || true)
              for p in $plat; do left+=("$p@$v"); done
            fi
            next=()
            for s in "${left[@]}"; do npm view "$s" version >/dev/null 2>&1 || next+=("$s"); done
            left=("${next[@]}")
            [ ${#left[@]} -eq 0 ] && [ -n "$plat" ] && break
            sleep "$gap"
          done
          for s in "${left[@]}"; do echo "::warning::$s is still not served by npm after 10 minutes; the follower is started anyway"; done
          printf '{"event_type":"wmd-release","client_payload":{"version":"%s"}}' "${TAG#v}" |
            gh api "repos/threadedstack/$REPO/dispatches" --input -

  on-failure:
    needs: [publish]
    if: failure()
    runs-on: ubuntu-24.04
    # reads this run's job list to name what failed; the issue is written with the App's token
    permissions:
      actions: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: threadedstack
          repositories: wmd
          permission-issues: write
      - name: open or update the issue on threadedstack/wmd
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # the same issue the release workflow opens for a failed release, so a failed npm publish is not missed
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || TAG="(not a version tag)"
          # shellcheck disable=SC2016
          failed=$(GH_TOKEN=$RUN_TOKEN gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '
            .jobs[] | select(.conclusion == "failure")
            | [.steps[]? | select(.conclusion == "failure") | .name] as $s
            | "- \(.name): \(if ($s | length) > 0 then ($s | join(", ")) else "no step failed" end)"')
          title="npm publish failed: $TAG"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'release: %s\nrun: %s\n\nfailed:\n%s\n\nRe-run failed jobs on the run publishes what is not on npm yet.\n' "$TAG" "$run" "$failed")
          n=$(gh issue list -R threadedstack/wmd --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then
            gh issue comment "$n" -R threadedstack/wmd --body "$body"
          else
            gh issue create -R threadedstack/wmd --title "$title" --body "$body"
          fi
